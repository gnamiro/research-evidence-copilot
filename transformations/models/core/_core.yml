version: 2

models:
  - name: paper_versions
    description: |
      One row per distinct arXiv paper version, selected from the most recently loaded observation of that version.

      Grain: one row per unique combination of arxiv_id and version.
    
    columns:
      - name: run_id
        description: Ingestion run that observed this paper version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ingestion_runs')
                field: run_id

      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
      
      - name: version
        description: Version number of the arXiv paper.
        data_tests:
          - not_null
      
      - name: title
        description: Paper title 
        data_tests:
          - not_null
      
      - name: abstract
        description: Paper abstract
      
      - name: authors
        description: Authors preserved as a JSON array.
      
      - name: categories
        description: arXiv categories preserved as a JSON array.

      - name: primary_category
        description: Primary arXiv category assigned to the paper.
        data_tests:
          - not_null

      - name: published_at
        description: Timestamp when this paper version was initially published.

      - name: updated_at
        description: Timestamp when this paper version was last updated.

      - name: license
        description: Paper licence reported by arXiv, when available.

      - name: pdf_url
        description: URL of the paper PDF.

      - name: source_url
        description: URL of the paper abstract page on arXiv.

      - name: matched_queries
        description: Ingestion queries that returned this paper.

      - name: raw_pages
        description: Raw API response pages containing this observation.

      - name: source_file_path
        description: Path to the run-specific records JSONL file.
        data_tests:
          - not_null

      - name: source_line_number
        description: One-based line number in the run-specific JSONL file.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when the observation was loaded into PostgreSQL.
        data_tests:
          - not_null
  
  - name: papers
    description: |
      One row per latest version of each paper according to arxiv_id

      Grain: One row per stable arxiv_id.
    
    columns:
      - name: run_id
        description: Ingestion run that observed this paper version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ingestion_runs')
                field: run_id

      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
          - unique
      
      - name: latest_version
        description: Version number of the arXiv paper.
        data_tests:
          - not_null
      
      - name: title
        description: Paper title 
        data_tests:
          - not_null
      
      - name: abstract
        description: Paper abstract
      
      - name: authors
        description: Authors preserved as a JSON array.
      
      - name: categories
        description: arXiv categories preserved as a JSON array.

      - name: primary_category
        description: Primary arXiv category assigned to the paper.
        data_tests:
          - not_null

      - name: published_at
        description: Timestamp when this paper version was initially published.

      - name: updated_at
        description: Timestamp when this paper version was last updated.

      - name: license
        description: Paper licence reported by arXiv, when available.

      - name: pdf_url
        description: URL of the paper PDF.

      - name: source_url
        description: URL of the paper abstract page on arXiv.

      - name: matched_queries
        description: Ingestion queries that returned this paper.

      - name: raw_pages
        description: Raw API response pages containing this observation.

      - name: source_file_path
        description: Path to the run-specific records JSONL file.
        data_tests:
          - not_null

      - name: source_line_number
        description: One-based line number in the run-specific JSONL file.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when the observation was loaded into PostgreSQL.
        data_tests:
          - not_null
  - name: int_paper_authors_expanded
    description: |
      One row per paper author, with normalized author names and hashed author IDs.

      Grain: One row per unique combination of arxiv_id, and normalized_author_name.

      P.S: for the sake of simplicity, we are using md5 hash of normalized_author_name as author_id. In a production system, we would use a more robust method to generate stable author IDs.
      Also for the sake of simplicity, we are including this intermediate model in the core layer. In a production system, we would likely place this in an intermediate layer (silver model).

    columns:
      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('papers')
                field: arxiv_id
      - name: author_name
        description: Author name as reported by arXiv.
        data_tests:
          - not_null
      - name: normalized_author_name
        description: Author name normalized for consistent representation.
        data_tests:
          - not_null
      - name: author_position
        description: Position of the author in the author list for the paper.
        data_tests:
          - not_null
      - name: author_id
        description: Hashed author ID generated from the normalized author name.
        data_tests:
          - not_null
  - name: authors
    description: |
      One row per unique author, with a stable author ID and normalized author name.

      Grain: One row per unique normalized_author_name.
    columns:
      - name: author_id
        description: Hashed author ID generated from the normalized author name.
        data_tests:
          - not_null
          - unique
      - name: author_name
        description: Author name as reported by arXiv.
        data_tests:
          - not_null
      - name: normalized_author_name
        description: Author name normalized for consistent representation.
        data_tests:
          - not_null
          - unique
  - name: paper_authors
    description: |
      One row per paper-author relationship, linking papers to their authors.

      Grain: One row per unique combination of arxiv_id and author_id.
    columns:
      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('papers')
                field: arxiv_id
      - name: author_id
        description: Hashed author ID generated from the normalized author name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('authors')
                field: author_id
      - name: author_position
        description: Position of the author in the author list for the paper.
        data_tests:
          - not_null
  - name: int_paper_categories_expanded
    description: |
      One row per paper arxiv_id and category_code.

      Grain: One row per unique combination of arxiv_id and normalized_category_code.

      P.S: for the sake of simplicity, we are including this intermediate model in the core layer. In a production system, we would likely place this in an intermediate layer (silver model).

    columns:
      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('papers')
                field: arxiv_id
      - name: category_code
        description: Category code as reported by arXiv.
        data_tests:
          - not_null
      - name: category_position
        description: Position of the category in the category list for the paper.
        data_tests:
          - not_null
      - name: is_primary
        description: Boolean flag indicating whether this category is the primary category for the paper.
        data_tests:
          - not_null
  - name: categories
    description: |
      One row per unique category, with a normalized category code.

      Grain: One row per unique normalized_category_code.
    columns:
      - name: category_code
        description: Category code as reported by arXiv.
        data_tests:
          - not_null
          - unique
  
  - name: paper_categories
    description: |
      One row per paper-category relationship, linking papers to their categories.

      Grain: One row per unique combination of arxiv_id and category_code.
    columns:
      - name: arxiv_id
        description: Stable arXiv paper id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('papers')
                field: arxiv_id
      - name: category_code
        description: Category code as reported by arXiv.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category_code
      - name: category_position
        description: Position of the category in the category list for the paper.
        data_tests:
          - not_null

      - name: is_primary
        description: Boolean flag indicating whether this category is the primary category for the paper.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
  
  - name: ingestion_runs
    description: |
      Analytics-ready history of ingestion executions.

      Grain: One row per unique run_id.
    columns:
      - name: run_id
        description: Unique identifier for the ingestion run.
        data_tests:
          - not_null
          - unique
      - name: source
        description: Source of the ingestion run (e.g., arXiv API).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['arxiv']
      - name: mode
        description: Mode of the ingestion run (e.g., full, incremental).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['full', 'incremental']
      - name: status
        description: Status of the ingestion run (running, success, or failed).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'running']
      - name: started_at
        description: Timestamp when the ingestion run started.
        data_tests:
          - not_null
      - name: completed_at
        description: Timestamp when the ingestion run completed.
      - name: start_date
        description: Date when the ingestion run started.
        data_tests:
          - not_null
      - name: cutoff_date
        description: Cutoff date for the ingestion run, used to filter papers.
        data_tests:
          - not_null
      - name: target
        description: Target of the ingestion run (e.g., papers, authors).
      - name: page_size
        description: Number of records requested per page in the ingestion run.
      - name: queries
        description: Ingestion queries executed during the run, preserved as a JSON array.
      - name: pages_downloaded
        description: Number of pages downloaded during the ingestion run.
      - name: records_fetched
        description: Number of records fetched during the ingestion run.
        data_tests:
          - not_null
      - name: output_records
        description: Number of records written to the output file during the ingestion run.
        data_tests:
          - not_null
      - name: error
        description: Error message if the ingestion run failed.
      - name: manifest_path
        description: Path to the ingestion run manifest file.
        data_tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the ingestion run record was loaded into PostgreSQL.
        data_tests:
          - not_null
      - name: duration_seconds
        description: >
          Total ingestion duration in seconds. Null while the run has no completion timestamp.

[project]
name = "research-evidence-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.0",
    "arxivql>=1.3.3",
    "dbt-core>=1.12.0",
    "dbt-postgres>=1.11.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.59.2",
]

[project.scripts]
ingest-arxiv = "pipeline.ingestion.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest-temp"]
markers = [
    "DBintegration: tests that interact with PostgreSQL" 
]
